name: Build & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      
      - name: Grant execute permission to gradlew
        run: chmod +x gradlew
      
      - name: Build library
        run: ./gradlew :flexiblegrid:assembleRelease
      
      - name: Build demo app
        run: ./gradlew :app:assembleDebug
      
      - name: Run library tests
        run: ./gradlew :flexiblegrid:testReleaseUnitTest || echo "Tests not configured, skipping"
      
      - name: Check code quality
        run: ./gradlew :flexiblegrid:lint || echo "Lint not configured, skipping"
      
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            flexiblegrid/build/reports/
            app/build/reports/
